<style>
  /* Layout: one fixed-ratio SVG chart (2000x1040) that scales to the window; dark-only by design, like the source poster. */
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --card: #15161a;
    --fg: #ecedf0;
    --muted: #9a9ca4;
    --line: #5c5f66;
    --kahn: #e5706a;
    --niel: #52c48a;
    --dopp: #d39be6;
    --tied: #6f92f2;
    --tann: #cbbd8c;
    --other: #9a9ca4;
    --loop: #f0524f;
    --secret: #a98cf6;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--sans);
    padding-block: 16px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .frame { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #tree { display: block; width: 100%; min-width: 1100px; height: auto; font-family: var(--sans); }
  .hint { display: none; color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  @media (max-width: 1120px) { .hint { display: block; } }

  .bg { fill: var(--bg); }
  .title { fill: var(--fg); font-size: 40px; font-weight: 500; letter-spacing: 22px; text-anchor: middle; }
  .subtitle { fill: var(--muted); font-size: 13.5px; letter-spacing: 4.5px; text-anchor: middle; }

  .box { fill: var(--card); stroke: var(--c); stroke-width: 1.6; }
  .name { fill: var(--fg); font-size: 13.5px; font-weight: 600; text-anchor: middle; }
  .sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
  .yr { fill: var(--fg); font-family: var(--mono); font-size: 11px; font-weight: 600; text-anchor: middle; }
  .lab { fill: var(--muted); font-size: 9.5px; text-anchor: middle; }
  .ring { fill: none; stroke: var(--c); stroke-width: 2; }
  .ph { fill: color-mix(in srgb, var(--c) 28%, var(--card)); }
  .ph-i { fill: color-mix(in srgb, var(--c) 75%, var(--card)); }
  .age { cursor: pointer; outline: none; }
  .age:hover .ring, .age:focus-visible .ring { stroke: var(--fg); stroke-width: 3; }

  .ln { fill: none; stroke-width: 1.6; }
  .ln.parent, .ln .parent, g.parent path { stroke: var(--line); }
  .adopt path, line.adopt { stroke: var(--line); stroke-dasharray: 2 4; }
  .secret path, line.secret { stroke: var(--secret); stroke-dasharray: 7 5; }
  .loop path, line.loop { stroke: var(--loop); stroke-dasharray: 7 5; stroke-width: 2; }
  .note text { font-size: 12.5px; font-weight: 500; }
  .loop-t text { fill: var(--loop); }
  .secret-t text { fill: var(--secret); }
  .rule { stroke: #24262b; stroke-width: 1; }
  .legend text { fill: var(--fg); font-size: 13px; }
  .legend .small { fill: var(--muted); font-size: 11.5px; }

  .tip {
    position: fixed; z-index: 20; pointer-events: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px; width: 176px; box-shadow: 0 12px 32px rgb(0 0 0 / .55);
    font-size: 12.5px; line-height: 1.35;
  }
  .tip img { display: block; width: 160px; height: 160px; border-radius: 6px; object-fit: cover; margin-bottom: 6px; }
  .tip .none { width: 160px; height: 60px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); background: var(--bg); margin-bottom: 6px; font-size: 11.5px; }

  footer { color: var(--muted); font-size: 12px; margin-top: 12px; max-width: 70ch; }
  footer a { color: var(--fg); }
</style>

</footer>

<script>
(() => {
  const tip = document.getElementById('tip');
  let pinned = null;
  function show(g, ev) {
    const src = g.querySelector('image')?.getAttribute('href');
    tip.replaceChildren();
    if (src) { const im = new Image(); im.src = src; im.alt = ''; tip.append(im); }
    else { const d = document.createElement('div'); d.className = 'none'; d.textContent = 'No photo found'; tip.append(d); }
    const t = document.createElement('div'); t.textContent = g.dataset.tip; tip.append(t);
    tip.hidden = false;
    const r = g.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    x = Math.max(8, Math.min(x, innerWidth - tw - 8));
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hide() { if (!pinned) tip.hidden = true; }
  document.querySelectorAll('.age').forEach(g => {
    g.addEventListener('mouseenter', () => { if (!pinned) show(g); });
    g.addEventListener('mouseleave', hide);
    g.addEventListener('focus', () => show(g));
    g.addEventListener('blur', () => { pinned = null; hide(); });
    g.addEventListener('click', e => { e.stopPropagation(); pinned = pinned === g ? null : g; show(g); if (!pinned) hide(); });
  });
  document.addEventListener('click', () => { pinned = null; tip.hidden = true; });
  addEventListener('scroll', () => { if (!pinned) tip.hidden = true; }, true);
})();
</script>
